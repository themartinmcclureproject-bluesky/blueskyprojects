<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>August 2026 Update | The Blue Sky Ecosystem Projects CIC</title>
    <style>
        /* Sets up a full-screen flexible layout */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
            background-color: #525659;
            display: flex;
            flex-direction: column;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        
        /* Top Title Bar */
        .top-bar {
            background-color: #0a3d62;
            color: white;
            padding: 15px 20px;
            text-align: center;
            z-index: 10;
        }
        .top-bar h1 {
            margin: 0;
            font-size: 14pt;
            font-weight: normal;
        }
        .top-bar a {
            color: white;
            text-decoration: none;
        }
        .top-bar a:hover {
            text-decoration: underline;
        }

        /* Tab Navigation Container */
        .tabs-container {
            display: flex;
            background-color: #e1e4e8;
            padding: 10px 20px 0 20px;
            border-bottom: 3px solid #ffffff;
        }

        /* Individual Tabs */
        .tab {
            padding: 10px 25px;
            font-size: 12pt;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px 8px 0 0;
            margin-right: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Active Viewer Tab */
        .tab-active {
            background-color: #ffffff;
            color: #0a3d62;
            border: 1px solid #d1d5da;
            border-bottom: none;
            /* Pulls the tab down slightly to merge with the viewer area */
            margin-bottom: -3px; 
            padding-bottom: 13px; 
        }

        /* Download Tab */
        .tab-download {
            background-color: #d1d5da;
            color: #24292e;
            border: 1px solid transparent;
            margin-left: auto; /* Pushes the download tab to the right side */
        }
        .tab-download:hover {
            background-color: #0a3d62;
            color: white;
        }

        /* Document Viewer Area */
        .document-viewer {
            flex-grow: 1;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* The PDF expands to fill all middle space */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Professional Top Bar -->
    <div class="top-bar">
        <h1><a href="https://blueskyprojects.org.uk/">The Blue Sky Ecosystem Projects CIC</a> - August 2026 Update</h1>
    </div>

    <!-- Tab System -->
    <div class="tabs-container">
        <div class="tab tab-active">View Update</div>
        <a href="../August_2026_Update_BskyP.pdf" download class="tab tab-download">Download Official PDF Report</a>
    </div>

    <!-- Document Viewer Area -->
    <div class="document-viewer">
        <iframe src="../August_2026_Update_BskyP.pdf" title="August 2026 Update"></iframe>
    </div>

</body>
</html>
