<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>August 2026 Update | The Blue Sky Ecosystems Projects CIC</title>
    <style>
        /* Sets up a full-screen flexible layout */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
            background-color: #525659;
            display: flex;
            flex-direction: column;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        /* Top Title Bar */
        .top-bar {
            background-color: #0a3d62;
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .top-bar h1 {
            margin: 0;
            font-size: 14pt;
            font-weight: normal;
        }
        /* The PDF expands to fill all middle space */
        iframe {
            width: 100%;
            flex-grow: 1;
            border: none;
            display: block;
        }
        /* Bottom Download Bar */
        .bottom-bar {
            background-color: #ffffff;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .download-btn {
            display: inline-block;
            background-color: #0a3d62;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            font-size: 12pt;
            transition: background-color 0.3s;
        }
        .download-btn:hover {
            background-color: #3c6382;
        }
    </style>
</head>
<body>

    <!-- Professional Top Bar -->
    <div class="top-bar">
        <h1>The Blue Sky Ecosystems Projects CIC - August 2026 Update</h1>
    </div>

    <!-- Edge-to-Edge PDF Viewer -->
    <iframe src="../August_2026_Update_BskyP.pdf" title="August 2026 Update"></iframe>

    <!-- Bottom Bar with Download Button -->
    <div class="bottom-bar">
        <a href="../August_2026_Update_BskyP.pdf" download class="download-btn">Download Official PDF Report</a>
    </div>

</body>
</html>
