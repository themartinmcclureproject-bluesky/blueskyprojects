<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #1d2d44;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        a {
            color: #0077b6;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // This script catches anyone looking for the old PDF and instantly redirects them
        if (window.location.pathname.includes("overview.pdf")) {
            window.location.replace("https://www.blueskyprojects.org.uk/");
        } else {
            // A backup redirect for any other broken links, sending them home after 2 seconds
            setTimeout(function() {
                window.location.replace("https://www.blueskyprojects.org.uk/");
            }, 2000);
        }
    </script>
</head>
<body>
    <div>
        <h2>Taking you to our homepage...</h2>
        <p>If you are not redirected automatically, <a href="https://www.blueskyprojects.org.uk/">click here</a>.</p>
    </div>
</body>
</html>
