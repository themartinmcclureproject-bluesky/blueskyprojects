<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Blue Sky Ecosystem Projects CIC</title>
  <!-- Fast Document Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #0b1329;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 85px; /* Leaves room so content never hides behind the button */
    }
    /* BRAND HEADER */
    header {
      background: #0f172a;
      padding: 14px 18px;
      border-bottom: 2px solid #0284c7;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    header h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
    }
    header p {
      font-size: 0.78rem;
      color: #38bdf8;
      margin-top: 2px;
      font-weight: 500;
    }

    /* DOCUMENT CONTAINER */
    #document-container {
      width: 100%;
      max-width: 720px;
      margin: 16px auto 0 auto;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pdf-page-canvas {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 16px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      background-color: #ffffff;
    }
    .loading-status {
      padding: 40px 20px;
      font-size: 0.95rem;
      color: #94a3b8;
      text-align: center;
    }

    /* ANCHORED BOTTOM ACTION BAR */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.25);
      z-index: 100;
    }
    .btn-download {
      flex: 2;
      max-width: 280px;
      text-align: center;
      background-color: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }
    .btn-download:active {
      background-color: #0369a1;
    }
    .btn-site {
      flex: 1;
      max-width: 140px;
      text-align: center;
      background-color: #f1f5f9;
      color: #0f172a;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 12px 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Blue Sky Ecosystem Projects CIC</h1>
    <p>A Global Ecosystem of Even, Loving Care</p>
  </header>

  <!-- THE DOCUMENT RENDERS SEAMLESSLY HERE -->
  <div id="document-container">
    <div class="loading-status" id="loading-spinner">Opening document...</div>
  </div>

  <!-- CLEAN DOWNLOAD BUTTON (NO FILE EXTENSIONS VISIBLE) -->
  <div class="bottom-bar">
    <a class="btn-download" href="Back_Of_Business_Card_INFORMATION.pdf" download="The_Blue_Sky_Projects_Overview.pdf">
      ⬇ Download Document
    </a>
    <a class="btn-site" href="https://www.blueskyprojects.org.uk">
      Visit Website
    </a>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileUrl = 'Back_Of_Business_Card_INFORMATION.pdf';

    async function displayPDF() {
      const container = document.getElementById('document-container');
      try {
        const loadingTask = pdfjsLib.getDocument(fileUrl);
        const pdf = await loadingTask.promise;
        container.innerHTML = ''; // Clears the loading status

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);
          // Scale at 2.0 keeps text crisp on mobile Retina and Pixel screens
          const viewport = page.getViewport({ scale: 2.0 });

          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page-canvas';
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          container.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;
        }
      } catch (err) {
        // Fallback viewer if connection restricts scripts
        container.innerHTML = '<iframe src="https://docs.google.com/viewer?url=https://www.blueskyprojects.org.uk/' + fileUrl + '&embedded=true" style="width:100%; height:75vh; border:none; border-radius:6px; background:#fff;"></iframe>';
      }
    }

    window.addEventListener('DOMContentLoaded', displayPDF);
  </script>

</body>
</html>
